<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- macOS のアプリアイコンの格子に合わせた角丸四角（1024 中 824、角丸 185）。周囲は透明 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c8dff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b1020" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g transform="translate(0 72)">
  <g filter="url(#sh)" stroke-linejoin="round">
    <path d="M512 636 L262 520 L512 404 L762 520 Z" fill="#ffffff" fill-opacity="0.38"/>
    <path d="M512 556 L262 440 L512 324 L762 440 Z" fill="#ffffff" fill-opacity="0.62"/>
    <path d="M512 476 L262 360 L512 244 L762 360 Z" fill="#ffffff"/>
    <path d="M512 476 L262 360 L512 244 L762 360 Z" fill="none" stroke="#1d2026" stroke-opacity="0.85" stroke-width="18"/>
  </g>
  <!-- 「線画とパーツ」: 最上段の線画の上にパーツの色 -->
  <path d="M512 452 L322 364 L512 276 L702 364 Z" fill="#ffd166" fill-opacity="0.9"/>
  </g>
</svg>
